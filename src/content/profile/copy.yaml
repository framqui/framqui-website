    Backend development, software products, and artificial intelligence.
bio:
  - html: true
    es: |-
      Hola, soy <strong class="font-semibold text-[var(--fg)]">Andres Ramos</strong>. Llevo más de cinco años desarrollando software, sobre todo en backend. Desde inicios de 2026 me dedico a <strong class="font-semibold text-[var(--fg)]">crear productos</strong> y a integrar <strong class="font-semibold text-[var(--fg)]">inteligencia artificial</strong> en el trabajo. También comparto lo que voy aprendiendo.
    en: |-
      Hi, I'm <strong class="font-semibold text-[var(--fg)]">Andres Ramos</strong>. I have spent more than five years building software, mostly on the backend. Since early 2026 I have focused on <strong class="font-semibold text-[var(--fg)]">building products</strong> and bringing <strong class="font-semibold text-[var(--fg)]">artificial intelligence</strong> into the work. I also share what I learn.
  - html: true
    es: |-
      Nací en un pueblo pequeño y vivo en <strong class="font-semibold text-[var(--fg)]">Pitalito, Huila</strong>, un lugar conocido por su café. Fuera del trabajo levanto pesas, escucho rock y leo filosofía.
    en: |-
      I was born in a small town and I live in <strong class="font-semibold text-[var(--fg)]">Pitalito, Huila</strong>, a place known for its coffee. Outside of work I lift weights, listen to rock, and read philosophy.
  - html: false
    es: |-
      Pasé de construir e integrar piezas de software a acompañar el producto completo: entender el problema, diseñar la solución, implementarla, definir la arquitectura, desplegarla y coordinar el trabajo técnico.
    en: |-
      I moved from building and integrating pieces of software to following a product through its whole life: understanding the problem, designing the solution, implementing it, shaping the architecture, deploying it, and coordinating the technical work.

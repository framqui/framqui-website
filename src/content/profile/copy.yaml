    Este sitio es mi <strong class="font-semibold text-[var(--fg)]">bitácora pública</strong>. Aquí publicaré notas técnicas, reflexiones sobre productos, guías y el avance de los proyectos en los que trabajo.
  en: |-
    This site is my <strong class="font-semibold text-[var(--fg)]">public log</strong>. I will publish technical notes, reflections on products, guides, and progress on the projects I am working on.
